name: 合回主干

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  push-to-main:
    name: 推送到 main 分支
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 确保当前分支与远程同步
      - name: Fetch all branches
        run: |
          git fetch origin

      # 获取当前分支名称
      - name: Get current branch name
        id: get-branch
        run: |
          echo "branch_name=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV

      # 验证分支名称是否以 dev- 开头
      - name: Validate branch name
        run: |
          if [[ "${{ env.branch_name }}" != dev-* ]]; then
            echo "Error: 当前分支名称必须以 'dev-' 开头。"
            exit 1
          fi

      # 合并分支到 main
      - name: Merge branch to main
        run: |
          git checkout main
          git merge origin/${{ env.branch_name }}
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}