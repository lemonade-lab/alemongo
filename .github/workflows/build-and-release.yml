name: 发布版本

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（自增）'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: 打包并发布
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: "386"
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: ".exe"
            archive: zip
          - goos: windows
            goarch: "386"
            ext: ".exe"
            archive: zip

    steps:
      - name: 结账代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 tag 历史

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: 构建前端
        run: |
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend build

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.0'
          cache: true

      - name: 自动获取/自增版本号
        id: versioning
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            # 用户手动输入，自动加v前缀（如果没带）
            VERSION="${{ github.event.inputs.version }}"
            [[ $VERSION != v* ]] && VERSION="v$VERSION"
          else
            # 自动递增
            LATEST_TAG=$(git tag --sort=-v:refname | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              VERSION="v0.0.1"
            else
              VERSION_NUM=${LATEST_TAG#v}
              MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
              MINOR=$(echo $VERSION_NUM | cut -d. -f2)
              PATCH=$(echo $VERSION_NUM | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="v$MAJOR.$MINOR.$PATCH"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > version.txt
          echo "本次发布版本号: $VERSION"

      - name: 构建二进制文件
        run: |
          VERSION=$(cat version.txt)
          LDFLAGS="-X main.Version=${VERSION} -X main.BuildTime=$(date +%s) -s -w"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "${LDFLAGS}" -o alemongo${{ matrix.ext }}

      - name: 创建压缩包
        run: |
          VERSION=$(cat version.txt)
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czf alemongo-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION}.tar.gz alemongo${{ matrix.ext }}
          else
            zip alemongo-${{ matrix.goos }}-${{ matrix.goarch }}-${VERSION}.zip alemongo${{ matrix.ext }}
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: alemongo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: alemongo-${{ matrix.goos }}-${{ matrix.goarch }}-*.${{ matrix.archive }}

      - name: 上传版本号文件
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt

  release:
    name: 创建发布
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 下载版本号
        uses: actions/download-artifact@v4
        with:
          name: version
          path: .

      - name: 加载版本号到环境变量
        id: get_version
        run: echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: 推送 tag（如不存在）
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          if ! git rev-parse ${{ env.VERSION }} >/dev/null 2>&1; then
            git tag ${{ env.VERSION }}
            git push origin ${{ env.VERSION }}
          fi

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: artifacts/**/alemongo-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 输出发布版本号
        run: |
          echo "本次发布版本号: ${{ env.VERSION }}"