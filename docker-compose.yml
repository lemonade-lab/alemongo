services:
  alemongo:
    image: ccr.ccs.tencentyun.com/ningmengchongshui/alemongo
    container_name: alemongo
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # 可选
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Asia/Shanghai  # 设置为中国时区
      # 应用配置（使用环境变量）
      - ALEMONGO_USE_ENV=true
      - ALEMONGO_SERVER_HOST=0.0.0.0
      - ALEMONGO_SERVER_PORT=17187
      - ALEMONGO_MODE=release
      # 数据库配置
      - ALEMONGO_DB_DRIVER=sqlite
      - ALEMONGO_DB_SQLITE_PATH=/app/work/data/alemongo.db
      # Token 配置 (建议通过 .env 覆盖 ALEMONGO_TOKEN_KEY)
      - ALEMONGO_TOKEN_KEY=${ALEMONGO_TOKEN_KEY:-alemongo}
      - ALEMONGO_TOKEN_EXPIRES_TIME=${ALEMONGO_TOKEN_EXPIRES_TIME:-24}
      # GitHub OAuth (可选, 未设置时为空)
      - ALEMONGO_GITHUB_CLIENT_ID=${ALEMONGO_GITHUB_CLIENT_ID:-}
      - ALEMONGO_GITHUB_CLIENT_SECRET=${ALEMONGO_GITHUB_CLIENT_SECRET:-}
      - ALEMONGO_GITHUB_REDIRECT_URL=${ALEMONGO_GITHUB_REDIRECT_URL:-}
      # SMTP 邮件 (可选, 未设置时为空)
      - ALEMONGO_SMTP_HOST=${ALEMONGO_SMTP_HOST:-}
      - ALEMONGO_SMTP_PORT=${ALEMONGO_SMTP_PORT:-}
      - ALEMONGO_SMTP_USERNAME=${ALEMONGO_SMTP_USERNAME:-}
      - ALEMONGO_SMTP_PASSWORD=${ALEMONGO_SMTP_PASSWORD:-}
      - ALEMONGO_SMTP_FROM_EMAIL=${ALEMONGO_SMTP_FROM_EMAIL:-}
    volumes:
      - ~/.ssh:/root/.ssh
      - ./work:/app/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - alemongo-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "17187:17187"
    volumes:
      - ./alemongo.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alemongo
    networks:
      - alemongo-network

volumes:
  redis-data:
    driver: local

networks:
  alemongo-network:
    driver: bridge
