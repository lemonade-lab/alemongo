services:
  alemongo:
    image: ccr.ccs.tencentyun.com/ningmengchongshui/alemongo
    container_name: alemongo
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai  # 设置为中国时区
    volumes:
      - ~/.ssh:/root/.ssh
      - ./work:/app/work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - alemongo-network

  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "17187:17187"
      - "17117:17117"
    volumes:
      - ./alemongo.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alemongo
    networks:
      - alemongo-network

volumes:
  redis-data:
    driver: local

networks:
  alemongo-network:
    driver: bridge
